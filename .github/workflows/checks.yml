name: Checks
on: workflow_dispatch # Optional manual CI; no automatic hosted runs.
jobs:
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: node --check static/app.js
      - run: node --test tests/test_map_geometry.cjs tests/test_native_share.cjs tests/test_search_feedback.cjs
      - if: runner.os == 'Linux'
        run: docker compose config --quiet
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/check-windows-launcher.ps1
